adapter driver ftdi                    #configure adapter FTDI    
ftdi device_desc "Digilent USB Device" #target device name
ftdi vid_pid 0x0403 0x6010             #FDTI VID and PID

# channel 0 is dedicated for Digilent's DPTI Interface
# channel 1 is used for JTAG
ftdi channel 1                      

# only using TCK TDI TDO TMS, no reset
ftdi layout_init 0x0088 0x008b
reset_config none

adapter speed 5000                    #upload speed

# Enable sampling on falling edge for high JTAG speeds.
ftdi tdo_sample_edge falling          

transport select jtag                #select jtag

# source [find cpld/jtagspi.cfg]     #using for permanent SPI flash programming
source [find cpld/xilinx-xc7.cfg]

if { [info exists BITFILE] } {
  set _BITFILE $BITFILE
} else {
  echo "Error: use -c {set BITFILE <path/to/bit>}"
  shutdown
}

init
pld load 0 $_BITFILE
shutdown
